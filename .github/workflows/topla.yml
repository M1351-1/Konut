name: Veri topla

# GUVENLIK NOTU
# EVDS anahtari yalnizca GitHub Secrets icinde durur ve sadece
# "Veriyi cek" adimina ortam degiskeni olarak verilir.
# Hicbir adimda ekrana basilmaz, dosyaya yazilmaz, commit'lenmez.
# GitHub secrets degerlerini log ciktisinda otomatik maskeler.

on:
  schedule:
    # Her gun 06:00 UTC = Turkiye saati 09:00
    - cron: "0 6 * * *"
  workflow_dispatch:      # Actions sekmesinden elle de calistirilabilir

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Veriyi cek
        env:
          EVDS_ANAHTARI: ${{ secrets.EVDS_ANAHTARI }}
        run: python toplayici.py

      # Emniyet agi: anahtar bir sekilde cikti dosyasina sizdiysa
      # commit atilmaz, is akisi hata verip durur.
      - name: Guvenlik kontrolu
        env:
          EVDS_ANAHTARI: ${{ secrets.EVDS_ANAHTARI }}
        run: |
          if [ ! -f veri.json ]; then
            echo "veri.json bulunamadi."
            exit 1
          fi
          if [ -n "$EVDS_ANAHTARI" ] && grep -qF -- "$EVDS_ANAHTARI" veri.json; then
            echo "GUVENLIK HATASI: veri.json icinde API anahtari bulundu."
            echo "Commit iptal edildi. Anahtari YENILE ve kodu kontrol et."
            exit 1
          fi
          echo "veri.json temiz - anahtar icermiyor."

      - name: Degisiklik varsa kaydet
        run: |
          git config user.name  "veri-botu"
          git config user.email "veri-botu@users.noreply.github.com"
          if git diff --quiet -- veri.json; then
            echo "Degisiklik yok, commit atlaniyor."
          else
            git add veri.json
            git commit -m "veri guncellendi $(date -u +%Y-%m-%d)"
            git push
          fi
